<svg viewBox="0 0 1100 900" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1100" height="900" fill="#f8fafc"/>
  <text x="550" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Aptura ERP — High-Availability Architecture (100,000 Concurrent Users)</text>

  <!-- Users -->
  <rect x="450" y="60" width="200" height="50" rx="10" fill="#1e293b"/>
  <text x="550" y="90" text-anchor="middle" font-size="14" fill="#fff" font-weight="600">100,000 Concurrent Users</text>
  <line x1="550" y1="110" x2="550" y2="140" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- CDN -->
  <rect x="425" y="140" width="250" height="55" rx="10" fill="#0ea5e9"/>
  <text x="550" y="165" text-anchor="middle" font-size="14" fill="#fff" font-weight="600">CDN / Edge Cache</text>
  <text x="550" y="182" text-anchor="middle" font-size="11" fill="#e0f2fe">Static assets, cached GET responses</text>
  <line x1="550" y1="195" x2="550" y2="225" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Load Balancer -->
  <rect x="400" y="225" width="300" height="55" rx="10" fill="#2563eb"/>
  <text x="550" y="250" text-anchor="middle" font-size="14" fill="#fff" font-weight="600">Load Balancer</text>
  <text x="550" y="267" text-anchor="middle" font-size="11" fill="#dbeafe">Round-robin + health checks, SSL termination</text>
  <line x1="550" y1="280" x2="550" y2="305" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- App server pool -->
  <rect x="150" y="305" width="800" height="110" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="170" y="325" font-size="12" font-weight="700" fill="#4338ca">Auto-Scaling App Server Pool (stateless — JWT auth, no server-side sessions)</text>
  <g font-size="12" fill="#1e293b">
    <rect x="180" y="335" width="150" height="60" rx="8" fill="#c7d2fe"/><text x="255" y="370" text-anchor="middle">Django API #1</text>
    <rect x="360" y="335" width="150" height="60" rx="8" fill="#c7d2fe"/><text x="435" y="370" text-anchor="middle">Django API #2</text>
    <rect x="540" y="335" width="150" height="60" rx="8" fill="#c7d2fe"/><text x="615" y="370" text-anchor="middle">Django API #3</text>
    <rect x="720" y="335" width="180" height="60" rx="8" fill="#c7d2fe"/><text x="810" y="362" text-anchor="middle">Django API #N</text><text x="810" y="380" text-anchor="middle" font-size="10">(scales with load)</text>
  </g>

  <line x1="350" y1="415" x2="280" y2="450" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="550" y1="415" x2="550" y2="450" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="750" y1="415" x2="830" y2="450" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Cache layer -->
  <rect x="80" y="450" width="360" height="90" rx="10" fill="#f97316"/>
  <text x="260" y="478" text-anchor="middle" font-size="14" fill="#fff" font-weight="600">Redis Cache Cluster</text>
  <text x="260" y="497" text-anchor="middle" font-size="11" fill="#ffedd5">Reports, product/category lookups,</text>
  <text x="260" y="512" text-anchor="middle" font-size="11" fill="#ffedd5">session/rate-limit counters</text>

  <!-- Message Queue -->
  <rect x="660" y="450" width="360" height="90" rx="10" fill="#8b5cf6"/>
  <text x="840" y="478" text-anchor="middle" font-size="14" fill="#fff" font-weight="600">Message Queue (Celery + Redis/RabbitMQ)</text>
  <text x="840" y="497" text-anchor="middle" font-size="11" fill="#ede9fe">Report generation, notifications,</text>
  <text x="840" y="512" text-anchor="middle" font-size="11" fill="#ede9fe">bulk stock/sales imports</text>

  <!-- Worker -->
  <line x1="840" y1="540" x2="840" y2="565" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="740" y="565" width="200" height="45" rx="8" fill="#a78bfa"/>
  <text x="840" y="592" text-anchor="middle" font-size="12" fill="#fff" font-weight="600">Background Workers</text>

  <!-- DB layer -->
  <line x1="260" y1="540" x2="260" y2="565" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="550" y1="415" x2="550" y2="640" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="2 3" opacity="0.55"/>

  <rect x="80" y="565" width="360" height="55" rx="10" fill="#16a34a"/>
  <text x="260" y="590" text-anchor="middle" font-size="13" fill="#fff" font-weight="600">PgBouncer (Connection Pooling)</text>
  <text x="260" y="606" text-anchor="middle" font-size="10" fill="#dcfce7">Many app instances, one manageable pool of DB connections</text>

  <line x1="260" y1="620" x2="260" y2="650" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="90" y="650" width="340" height="150" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
  <text x="260" y="672" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">PostgreSQL Cluster</text>
  <rect x="110" y="685" width="140" height="50" rx="8" fill="#16a34a"/>
  <text x="180" y="706" text-anchor="middle" font-size="11" fill="#fff" font-weight="600">Primary</text>
  <text x="180" y="722" text-anchor="middle" font-size="9" fill="#dcfce7">Writes</text>
  <rect x="260" y="685" width="150" height="50" rx="8" fill="#4ade80"/>
  <text x="335" y="704" text-anchor="middle" font-size="10" fill="#052e16" font-weight="600">Read Replica(s)</text>
  <text x="335" y="720" text-anchor="middle" font-size="9" fill="#052e16">Reads (reports, listings)</text>
  <line x1="180" y1="735" x2="180" y2="760" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="260" y="778" text-anchor="middle" font-size="10" fill="#166534">Streaming replication + automated failover</text>
  <text x="260" y="793" text-anchor="middle" font-size="10" fill="#166534">Partitioned tables (e.g. sales by month) at high volume</text>

  <!-- Monitoring sidebar -->
  <rect x="480" y="650" width="540" height="150" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="750" y="672" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">Monitoring, Logging &amp; Backups (cross-cutting)</text>
  <text x="500" y="697" font-size="11" fill="#7f1d1d">• Prometheus + Grafana — request latency, error rate, queue depth, DB connections</text>
  <text x="500" y="717" font-size="11" fill="#7f1d1d">• Centralized logs (ELK/Loki) across all app instances</text>
  <text x="500" y="737" font-size="11" fill="#7f1d1d">• Automated nightly DB backups + point-in-time recovery, tested restores</text>
  <text x="500" y="757" font-size="11" fill="#7f1d1d">• Alerting (PagerDuty/Slack) on error-rate and latency thresholds</text>
  <text x="500" y="777" font-size="11" fill="#7f1d1d">• Multi-AZ deployment for failover; CDN absorbs traffic spikes at the edge</text>

  <line x1="550" y1="640" x2="550" y2="650" stroke="transparent"/>

  <text x="550" y="860" text-anchor="middle" font-size="11" fill="#64748b">See Section 2 of the Technical Report for the full explanation of each layer.</text>
</svg>
